fragment ApiKeyResult on ApiKey {
    identifier
    name
    authorizations
    validFrom
    validUntil
    status
}

mutation apiKeyCreate($apiKeyInput: ApiKeyInput!) {
    apiKeyCreate(apiKeyInput: $apiKeyInput)
}

mutation apiKeyRevoke($apiKeyRevokeInput: ApiKeyRevokeInput!) {
    apiKeyRevoke(input: $apiKeyRevokeInput)
} 

mutation accessTokenCreate {
    accessTokenCreate
}

query getApiKeys {
    apiKeys {
        ...ApiKeyResult
    }
}